name: Ladepunkt Tracker

on:
  schedule:
    - cron: '*/15 * * * *'   # alle 15 Minuten
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker script
        run: python tracker.py

       - name: Commit and push data (robust fix)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add daten.csv

          # Commit nur wenn Änderungen existieren
          git diff --cached --quiet && echo "No changes" && exit 0 || true

          git commit -m "Update Daten"

          # IMMER zuerst synchronisieren
          git fetch origin main
          git rebase origin/main || true

          # Push mit force-with-lease (sicherer als force)
          git push origin main --force-with-lease
